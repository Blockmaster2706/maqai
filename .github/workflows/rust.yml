name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch bundled ADB
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) python scripts/fetch-platform-tools.py linux ;;
            Windows) python scripts/fetch-platform-tools.py windows ;;
            macOS) python scripts/fetch-platform-tools.py macos ;;
          esac
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p maqai-ui --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install trunk --locked
      - run: trunk build
      - run: cargo clippy --locked -p maqai --all-targets -- -D warnings
      - run: cargo test --locked -p maqai --lib
