[package]
name = "maqai-ui"
version = "0.1.0"
edition = "2021"
authors = ["Blockmaster2706 <wynter@breedable.men>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Blockmaster2706/Maqai"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"

[workspace]
members = ["src-tauri"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
